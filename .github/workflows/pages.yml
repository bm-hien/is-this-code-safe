name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "scripts/build_web_editor.mjs"
      - "scripts/monaco_editor_*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install web build dependencies
        run: npm ci
      - name: Build browser editor
        run: npm run build:web
      - name: Verify committed browser assets
        run: git diff --exit-code -- web/assets
      - name: Test browser analyzer
        run: npm run test:web
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
